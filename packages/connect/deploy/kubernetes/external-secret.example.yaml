# Example consumer (not part of the kustomization): apply in your app's namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-db
spec:
  refreshInterval: 15m
  secretStoreRef: { kind: ClusterSecretStore, name: openvireo }
  target: { name: app-db }
  data:
    - secretKey: username
      remoteRef: { key: "Team%20Infra/items/Deploy/Database", property: username }
    - secretKey: password
      remoteRef: { key: "Team%20Infra/items/Deploy/Database", property: password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github
spec:
  refreshInterval: 15m
  secretStoreRef: { kind: ClusterSecretStore, name: openvireo-items }
  target: { name: github }
  dataFrom:
    - extract: { key: "Team%20Infra/items/GitHub" }
