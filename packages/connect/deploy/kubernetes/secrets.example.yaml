# Placeholders: replace before applying, or create the Secrets yourself (kubectl create secret generic …).
#   openvireo-connect:     the service account token and the connect tokens config (hashes only)
#   openvireo-connect-eso: the plain connect token ESO presents (`openvireo connect token --name eso` prints it)
apiVersion: v1
kind: Secret
metadata:
  name: openvireo-connect
  labels: { app.kubernetes.io/name: openvireo-connect }
type: Opaque
stringData:
  sa-token: "ov_sa_REPLACE_ME"
  tokens.json: |
    [{"name":"eso","sha256":"REPLACE_WITH_SHA256_FROM_openvireo_connect_token","vaults":["*"],"access":"read"}]
---
apiVersion: v1
kind: Secret
metadata:
  name: openvireo-connect-eso
  labels: { app.kubernetes.io/name: openvireo-connect }
type: Opaque
stringData:
  token: "ov_ct_REPLACE_ME"
