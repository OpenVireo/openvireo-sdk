# Placeholders: replace before applying, or create the Secrets yourself (kubectl create secret generic …).
#   kpx-connect:     the service account token and the connect tokens config (hashes only)
#   kpx-connect-eso: the plain connect token ESO presents (`kpx connect token --name eso` prints it)
apiVersion: v1
kind: Secret
metadata:
  name: kpx-connect
  labels: { app.kubernetes.io/name: kpx-connect }
type: Opaque
stringData:
  sa-token: "kpx_sa_REPLACE_ME"
  tokens.json: |
    [{"name":"eso","sha256":"REPLACE_WITH_SHA256_FROM_kpx_connect_token","vaults":["*"],"access":"read"}]
---
apiVersion: v1
kind: Secret
metadata:
  name: kpx-connect-eso
  labels: { app.kubernetes.io/name: kpx-connect }
type: Opaque
stringData:
  token: "kpx_ct_REPLACE_ME"
