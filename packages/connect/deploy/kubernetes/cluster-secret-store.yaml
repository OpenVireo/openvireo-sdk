# ESO webhook provider pointed at ov connect (no custom operator).
#
# "openvireo": one field per remoteRef. key = "<vault>/items/[<group>/…]<entry>" (percent-encoded), property = field.
# "openvireo-items": dataFrom.extract of a whole item: key as above, every field becomes a key of the Secret.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openvireo
spec:
  provider:
    webhook:
      url: "http://openvireo-connect.openvireo-connect.svc.cluster.local:8080/v1/vaults/{{ .remoteRef.key }}?field={{ .remoteRef.property }}"
      method: GET
      timeout: 10s
      headers:
        Accept: application/json
        Authorization: "Bearer {{ print .auth.token }}"
      result:
        jsonPath: "$.value"
      secrets:
        - name: auth
          secretRef:
            name: openvireo-connect-eso
            namespace: openvireo-connect
            key: token
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openvireo-items
spec:
  provider:
    webhook:
      url: "http://openvireo-connect.openvireo-connect.svc.cluster.local:8080/v1/vaults/{{ .remoteRef.key }}"
      method: GET
      timeout: 10s
      headers:
        Accept: application/json
        Authorization: "Bearer {{ print .auth.token }}"
      result:
        jsonPath: "$.fields"
      secrets:
        - name: auth
          secretRef:
            name: openvireo-connect-eso
            namespace: openvireo-connect
            key: token
