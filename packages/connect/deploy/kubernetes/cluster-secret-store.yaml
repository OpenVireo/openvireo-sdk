# ESO webhook provider pointed at kpx connect (no custom operator).
#
# "kpx": one field per remoteRef. key = "<vault>/items/[<group>/…]<entry>" (percent-encoded), property = field.
# "kpx-items": dataFrom.extract of a whole item: key as above, every field becomes a key of the Secret.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kpx
spec:
  provider:
    webhook:
      url: "http://kpx-connect.kpx-connect.svc.cluster.local:8080/v1/vaults/{{ .remoteRef.key }}?field={{ .remoteRef.property }}"
      method: GET
      timeout: 10s
      headers:
        Accept: application/json
        Authorization: "Bearer {{ print .auth.token }}"
      result:
        jsonPath: "$.value"
      secrets:
        - name: auth
          secretRef:
            name: kpx-connect-eso
            namespace: kpx-connect
            key: token
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kpx-items
spec:
  provider:
    webhook:
      url: "http://kpx-connect.kpx-connect.svc.cluster.local:8080/v1/vaults/{{ .remoteRef.key }}"
      method: GET
      timeout: 10s
      headers:
        Accept: application/json
        Authorization: "Bearer {{ print .auth.token }}"
      result:
        jsonPath: "$.fields"
      secrets:
        - name: auth
          secretRef:
            name: kpx-connect-eso
            namespace: kpx-connect
            key: token
