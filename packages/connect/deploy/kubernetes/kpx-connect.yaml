apiVersion: apps/v1
kind: Deployment
metadata:
  name: kpx-connect
  labels: { app.kubernetes.io/name: kpx-connect }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: kpx-connect }
  template:
    metadata:
      labels: { app.kubernetes.io/name: kpx-connect }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: kpx-connect
          # Build it with packages/connect/Dockerfile and push it to your registry
          image: ghcr.io/keepassxc/kpx-connect:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - { name: KPX_CONNECT_HOST, value: "0.0.0.0" }
            - { name: KPX_CONNECT_PORT, value: "8080" }
            - { name: KPX_CONNECT_CACHE_TTL, value: "5" }
            - { name: KPX_SERVICE_ACCOUNT_TOKEN_FILE, value: /etc/kpx/sa-token }
            - { name: KPX_CONNECT_TOKENS_FILE, value: /etc/kpx/tokens.json }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /etc/kpx, readOnly: true }
      volumes:
        - name: config
          secret:
            secretName: kpx-connect
            defaultMode: 0400
---
apiVersion: v1
kind: Service
metadata:
  name: kpx-connect
  labels: { app.kubernetes.io/name: kpx-connect }
spec:
  selector: { app.kubernetes.io/name: kpx-connect }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
# Only ESO's controller may call kpx connect; kpx connect may only reach DNS and HTTPS (auth + sync servers)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kpx-connect
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: kpx-connect }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: external-secrets }
      ports:
        - { port: 8080, protocol: TCP }
  egress:
    - ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - ports:
        - { port: 443, protocol: TCP }
