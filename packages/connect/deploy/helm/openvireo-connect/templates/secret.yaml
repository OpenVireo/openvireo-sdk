{{- if not .Values.existingSecret }}
{{- if not .Values.serviceAccountToken }}{{ fail "set serviceAccountToken or existingSecret" }}{{ end }}
{{- if not .Values.connectTokens }}{{ fail "set connectTokens (from `openvireo connect token`) or existingSecret" }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openvireo-connect.fullname" . }}
  labels: {{- include "openvireo-connect.labels" . | nindent 4 }}
type: Opaque
stringData:
  sa-token: {{ .Values.serviceAccountToken | quote }}
  tokens.json: {{ .Values.connectTokens | toJson | quote }}
{{- end }}
{{- if and .Values.externalSecrets.enabled .Values.externalSecrets.token }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.externalSecrets.tokenSecret }}
  labels: {{- include "openvireo-connect.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.externalSecrets.token | quote }}
{{- end }}
