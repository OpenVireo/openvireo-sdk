{{- if .Values.externalSecrets.enabled }}
{{- range $suffix, $jsonPath := dict "" "$.value" "-items" "$.fields" }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ $.Values.externalSecrets.storeName }}{{ $suffix }}
  labels: {{- include "openvireo-connect.labels" $ | nindent 4 }}
spec:
  provider:
    webhook:
      url: "{{ include "openvireo-connect.url" $ }}/v1/vaults/{{ "{{" }} .remoteRef.key {{ "}}" }}{{ if eq $suffix "" }}?field={{ "{{" }} .remoteRef.property {{ "}}" }}{{ end }}"
      method: GET
      timeout: 10s
      headers:
        Accept: application/json
        Authorization: "Bearer {{ "{{" }} print .auth.token {{ "}}" }}"
      result:
        jsonPath: {{ $jsonPath | quote }}
      secrets:
        - name: auth
          secretRef:
            name: {{ $.Values.externalSecrets.tokenSecret }}
            namespace: {{ $.Release.Namespace }}
            key: token
{{- end }}
{{- end }}
