# Values for the upstream External Secrets Operator chart (no custom operator):
#   helm repo add external-secrets https://charts.external-secrets.io
#   helm install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace \
#     -f packages/connect/deploy/helm/external-secrets-values.yaml
installCRDs: true
# The kpx stores only need the webhook provider; keep the controller small
concurrent: 2
webhook:
  create: true
certController:
  create: true
serviceMonitor:
  enabled: false
resources:
  requests: { cpu: 10m, memory: 64Mi }
