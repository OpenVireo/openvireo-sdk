name: OpenVireo load secrets
description: Load secrets from OpenVireo vaults into the environment with a service account, masked in the logs
author: OpenVireo
branding:
  icon: lock
  color: green
inputs:
  service-account-token:
    description: The ov_sa_… service account token. Defaults to the OPENVIREO_SERVICE_ACCOUNT_TOKEN environment variable.
    required: false
  secrets:
    description: |
      Extra secrets to load, one NAME=ov://… per line (in addition to environment variables of this
      step whose values are ov:// references).
    required: false
  export-env:
    description: Export the values as environment variables for the following steps ("true"), or only set them as outputs of this step ("false").
    required: false
    default: "true"
outputs:
  loaded:
    description: Comma-separated names of the variables that were loaded. Every loaded NAME is also an output (when export-env is false).
runs:
  using: node24
  main: dist/index.mjs
