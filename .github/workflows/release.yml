# Publishes @openvireo/sdk when a vX.Y.Z tag is pushed, and creates the GitHub release (notes only, no
# binaries). `ov`, which includes `ov connect`, is the native Rust binary from openvireo-core's releases, and
# connect's container image (ghcr.io/openvireo/openvireo-connect) is built by the core release too.
# packages/cli stays only as a library of the GitHub Action. npm installs need GitHub Packages (@openvireo/core-wasm), so every `npm ci` has a token.
#
# GitHub Packages: always, with the workflow's GITHUB_TOKEN.
# npmjs.com: only when the repository variable NPMJS_PUBLISH is "true". Authenticates with npm
# trusted publishing (OIDC) once it is configured for each package on npmjs.com, otherwise with
# the NPM_TOKEN secret (needed for the very first publish, before the packages exist there).
#
# The same tarballs go to both registries. Versions already on a registry are skipped, so a failed
# run can be re-run. A manual run (workflow_dispatch) type-checks, tests, builds and packs without publishing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: read # npm ci installs @openvireo/core-wasm from GitHub Packages

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@openvireo"
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check the tag matches every package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          for p in sdk; do
            v="$(node -p "require('./packages/$p/package.json').version")"
            if [ "v$v" != "$GITHUB_REF_NAME" ]; then
              echo "::error::packages/$p is $v but the tag is $GITHUB_REF_NAME"; exit 1
            fi
          done
      - name: Pack
        run: |
          mkdir -p tarballs
          for p in sdk; do npm pack --workspace "packages/$p" --pack-destination tarballs; done
          ls -l tarballs
      - uses: actions/upload-artifact@v4
        with:
          name: tarballs
          path: tarballs/*.tgz

  github-packages:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tarballs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@openvireo"
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for p in sdk; do
            tgz="$(ls openvireo-$p-*.tgz)"
            v="${tgz#openvireo-$p-}"; v="${v%.tgz}"
            if npm view "@openvireo/$p@$v" version >/dev/null 2>&1; then
              echo "@openvireo/$p@$v is already on GitHub Packages"
            else
              npm publish "$tgz"
            fi
          done

  npmjs:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && vars.NPMJS_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tarballs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing needs npm 11.5.1 or later
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for p in sdk; do
            tgz="$(ls openvireo-$p-*.tgz)"
            v="${tgz#openvireo-$p-}"; v="${v%.tgz}"
            if npm view "@openvireo/$p@$v" version >/dev/null 2>&1; then
              echo "@openvireo/$p@$v is already on npmjs.com"
            else
              npm publish "$tgz" --provenance --access public
            fi
          done

  github-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the release
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$GITHUB_REF_NAME already has a release"; exit 0
          fi
          args=(--repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --verify-tag --generate-notes)
          if [[ "$version" == *-* ]]; then args+=(--prerelease); fi
          cat > notes.md <<EOF
          The npm package is \`@openvireo/sdk\` $version.

          This release has no binaries. \`ov\`, with \`ov connect\`, is the native binary from
          [openvireo-core's releases](https://github.com/OpenVireo/openvireo-core/releases) (signed, with a GPG-signed
          \`SHA256SUMS\`); connect's container image is \`ghcr.io/openvireo/openvireo-connect\`.
          EOF
          gh release create "$GITHUB_REF_NAME" "${args[@]}" --notes-file notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
