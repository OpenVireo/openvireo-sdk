# Type-checks (the packages and the docs' code samples), tests and builds every package on each push
# and pull request, and builds the API reference so a broken doc comment link fails here, not on the site.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read
  packages: read # npm ci installs @openvireo/core-wasm from GitHub Packages

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@openvireo"
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run docs:api
